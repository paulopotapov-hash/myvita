# Local-only HTTP overlay for validating the production topology without a
# certificate. Production must use docker-compose.prod.yml defaults instead.
services:
  backend:
    environment:
      ENVIRONMENT: development
      COOKIE_SECURE: "false"
      CORS_ORIGINS: '["${LOCAL_ORIGIN:-http://localhost}"]'
  # migrate loads the same Settings; without this it rejects the local host/origin above.
  migrate:
    environment:
      ENVIRONMENT: development
      COOKIE_SECURE: "false"
      CORS_ORIGINS: '["${LOCAL_ORIGIN:-http://localhost}"]'
