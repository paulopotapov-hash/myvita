# Isolated local E2E overlay. Always use a dedicated Compose project name.
services:
  db:
    ports: !override
      - "127.0.0.1:55440:5432"

  backend:
    environment:
      ALLOW_PUBLIC_CLINIC_ONBOARDING: "true"
      ALLOW_PUBLIC_PATIENT_REGISTRATION: "false"
      ALLOW_DIRECT_STAFF_CREATION: "true"
      CORS_ORIGINS: '["http://127.0.0.1:15173","http://localhost:15173"]'
    ports: !override
      - "127.0.0.1:18000:8000"

  frontend:
    ports: !override
      - "127.0.0.1:15173:5173"
