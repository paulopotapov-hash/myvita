services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: myvita
      POSTGRES_PASSWORD: myvita
      POSTGRES_DB: myvita
    volumes:
      - myvita_pg_data:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U myvita -d myvita"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      ALLOWED_HOSTS: '["localhost","127.0.0.1","testserver","backend"]'
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"
    volumes:
      - ./backend/app:/app/app
      - ./backend/migrations:/app/migrations
      - myvita_documents:/var/lib/myvita/documents

  frontend:
    build:
      context: ./frontend
      target: dev
    restart: unless-stopped
    environment:
      # See frontend/vite.config.ts — "localhost" from inside this
      # container is this container, not the backend one.
      VITE_PROXY_TARGET: http://backend:8000
    depends_on:
      - backend
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:5173/ >/dev/null || exit 1"]
      interval: 15s
      timeout: 3s
      start_period: 5s
      retries: 3

volumes:
  myvita_pg_data:
  myvita_documents:
  frontend_node_modules:
