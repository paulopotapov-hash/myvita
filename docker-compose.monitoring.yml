services:
  backend:
    environment:
      METRICS_TOKEN: ${METRICS_TOKEN:?Set a dedicated METRICS_TOKEN for the internal monitoring collector}
    networks:
      - monitoring

  backup:
    networks:
      - monitoring

  metrics-proxy:
    build: ./monitoring/metrics-proxy
    restart: always
    environment:
      METRICS_TOKEN: ${METRICS_TOKEN:?Set the same dedicated METRICS_TOKEN used by the backend}
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - edge
      - monitoring

  prometheus:
    image: prom/prometheus:v3.5.0
    restart: always
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=${PROMETHEUS_RETENTION:-15d}
      - --web.enable-lifecycle
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/alerts.yml:/etc/prometheus/alerts.yml:ro
      - ./monitoring/alerts.test.yml:/etc/prometheus/alerts.test.yml:ro
      - prometheus_data:/prometheus
    depends_on:
      - metrics-proxy
      - postgres-exporter
      - node-exporter
      - cadvisor
      - blackbox-exporter
      - alertmanager
    networks:
      - monitoring

  alertmanager:
    image: prom/alertmanager:v0.28.1
    restart: always
    command:
      - --config.file=/etc/alertmanager/alertmanager.yml
      - --storage.path=/alertmanager
    volumes:
      - ./monitoring/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - alertmanager_data:/alertmanager
    networks:
      - monitoring

  grafana:
    image: grafana/grafana:12.1.0
    restart: always
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?Set GRAFANA_ADMIN_PASSWORD via the deployment secret store}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
    ports:
      - "127.0.0.1:${GRAFANA_PORT:-3000}:3000"
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus
    networks:
      - monitoring
      - monitoring-admin

  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:v0.17.1
    restart: always
    environment:
      DATA_SOURCE_URI: db:5432/${POSTGRES_DB}?sslmode=disable
      DATA_SOURCE_USER: ${POSTGRES_USER}
      DATA_SOURCE_PASS: ${POSTGRES_PASSWORD}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - data
      - monitoring

  node-exporter:
    image: prom/node-exporter:v1.9.1
    restart: always
    command:
      - --path.rootfs=/host
      - --collector.textfile.directory=/metrics
    volumes:
      - /:/host:ro
      - myvita_backup_metrics:/metrics:ro
    networks:
      - monitoring

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.52.1
    restart: always
    privileged: true
    devices:
      - /dev/kmsg:/dev/kmsg
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker:/var/lib/docker:ro
      - /dev/disk:/dev/disk:ro
    networks:
      - monitoring

  blackbox-exporter:
    image: prom/blackbox-exporter:v0.27.0
    restart: always
    command:
      - --config.file=/etc/blackbox_exporter/config.yml
    volumes:
      - ./monitoring/blackbox.yml:/etc/blackbox_exporter/config.yml:ro
    networks:
      - edge
      - monitoring

volumes:
  prometheus_data:
  alertmanager_data:
  grafana_data:

networks:
  monitoring:
    internal: true
  monitoring-admin:
