modules:
  http_2xx:
    prober: http
    timeout: 5s
    http:
      method: GET
      preferred_ip_protocol: ip4
      valid_status_codes: [200]
  https_2xx:
    prober: http
    timeout: 10s
    http:
      method: GET
      preferred_ip_protocol: ip4
      valid_status_codes: [200]
      # Fails unless the certificate verifies and HTTPS is actually used.
      fail_if_not_ssl: true
      tls_config:
        insecure_skip_verify: false
