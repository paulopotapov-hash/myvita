name: CI

on:
  push:
    branches: ["main"]
  pull_request:

# Cancel a superseded run on the same branch instead of letting two runs of
# the same PR race each other for the Postgres service container.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12"
  # NOT a real secret: a fixed, throwaway value used only inside this CI
  # job's ephemeral Postgres container, which never exists outside this
  # run. Real deployments must set a generated JWT_SECRET_KEY via their own
  # secret store — see backend/.env.example and README.md#security.
  JWT_SECRET_KEY: "ci-only-not-a-real-secret-do-not-reuse"
  DATABASE_URL: "postgresql+psycopg://myvita:myvita@localhost:5432/myvita"
  TEST_DATABASE_URL: "postgresql+psycopg://myvita:myvita@localhost:5432/myvita"
  COOKIE_SECURE: "false"

jobs:
  backend:
    name: Backend (lint, types, tests, migrations)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: myvita
          POSTGRES_PASSWORD: myvita
          POSTGRES_DB: myvita
        ports:
          - 5432:5432
        # Wait for Postgres to actually accept connections before any step
        # tries to use it — without this, migrations/tests can flake on a
        # container that's still starting up.
        options: >-
          --health-cmd "pg_isready -U myvita"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Verify the app actually imports
        run: python -c "import app.main"

      - name: Lint (ruff)
        run: ruff check .

      - name: Backup script safety tests
        run: |
          bash ../scripts/test_backup_scripts.sh
          bash ../scripts/test_offsite_backup_scripts.sh

      - name: Type check (mypy)
        run: mypy app

      - name: Migrations — upgrade head on a clean database
        run: python -m alembic upgrade head

      - name: Migrations — downgrade one step then upgrade again
        run: |
          python -m alembic downgrade -1
          python -m alembic upgrade head

      - name: Tests with coverage
        run: pytest --cov=app --cov-report=term-missing --cov-report=xml

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-xml
          path: backend/coverage.xml

  dependency-scan:
    name: Dependency vulnerability scan (pip-audit)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      # Blocking, not advisory: this fails the build on any vulnerability
      # that isn't explicitly ignored below. Each --ignore-vuln is a
      # deliberate, documented exception — see backend/SECURITY-EXCEPTIONS.md
      # for the reasoning behind each one and when to re-check it. A new,
      # un-ignored finding fails CI until it's fixed or added there with a
      # reason — it is never silently allowed through.
      - name: pip-audit (dependency vulnerability gate)
        run: |
          pip-audit -r requirements.txt \
            --ignore-vuln PYSEC-2026-161 \
            --ignore-vuln PYSEC-2026-1941 \
            --ignore-vuln PYSEC-2026-1942 \
            --ignore-vuln PYSEC-2026-2280 \
            --ignore-vuln PYSEC-2026-2281 \
            --ignore-vuln PYSEC-2026-248 \
            --ignore-vuln PYSEC-2026-249

  docker-build:
    name: Docker image builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build backend image
        run: docker build -t myvita-backend:ci backend
      - name: Build frontend image
        run: docker build -t myvita-frontend:ci frontend
      - name: Build backup image
        run: docker build -f backup/Dockerfile -t myvita-backup:ci .
      - name: Validate monitoring configuration and alert behavior
        run: |
          docker run --rm --entrypoint /bin/promtool \
            -v "$PWD/monitoring:/etc/prometheus:ro" prom/prometheus:v3.5.0 \
            check config /etc/prometheus/prometheus.yml
          docker run --rm --entrypoint /bin/promtool \
            -v "$PWD/monitoring:/etc/prometheus:ro" prom/prometheus:v3.5.0 \
            test rules /etc/prometheus/alerts.test.yml
          python -m json.tool monitoring/grafana/dashboards/myvita-operations.json >/dev/null
          POSTGRES_USER=ci POSTGRES_PASSWORD=ci POSTGRES_DB=ci \
          JWT_SECRET_KEY=ci-only-not-a-real-secret-do-not-reuse PUBLIC_DOMAIN=localhost \
          METRICS_TOKEN=ci-metrics-only GRAFANA_ADMIN_PASSWORD=ci-grafana-only \
          docker compose -f docker-compose.prod.yml -f docker-compose.monitoring.yml config --quiet

  frontend:
    name: Frontend (typecheck, lint, tests, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Tests
        run: npm run test

      - name: Production build
        run: npm run build
