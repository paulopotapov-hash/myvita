# Production compose file — deliberately separate from docker-compose.yml
# (the dev file), which mounts source as volumes and exposes Postgres on
# the host for local debugging. Neither of those belong in production.
#
# Usage:
#   docker compose -f docker-compose.prod.yml up -d
#
# Every secret below is required with NO default — compose refuses to start
# rather than silently falling back to a dev credential. Set them via your
# platform's secret manager / CI secrets, or a non-committed .env.production
# file passed with `--env-file`. Never commit real values for these.
#
# This file is intentionally cloud-agnostic — it runs the same way on a
# bare VPS, an AWS/Azure/GCP VM, or any other Docker host. It does not
# assume a specific reverse proxy; put one (nginx, Caddy, Traefik, your
# cloud LB) in front of the `backend` service for TLS termination — see
# README.md#production for the full checklist.
services:
  db:
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER — no insecure default in production}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD — no insecure default in production}
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB — no insecure default in production}
    volumes:
      - myvita_pg_data:/var/lib/postgresql/data
    # No `ports:` mapping here on purpose: Postgres is reachable only from
    # other containers on this compose network, never from the host/public
    # internet. The dev compose file exposes 5432 for local debugging;
    # production must not.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    restart: always
    environment:
      ENVIRONMENT: production
      DEBUG: "false"
      COOKIE_SECURE: "true"
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:?Set JWT_SECRET_KEY — generate one, never reuse the dev value}
      CORS_ORIGINS: ${CORS_ORIGINS:?Set CORS_ORIGINS explicitly — e.g. '["https://app.myvita.pt"]'}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"
    # No source volumes: the image built by backend/Dockerfile already
    # contains the code. Mounting source over it here would silently make
    # "production" run whatever happens to be on the host filesystem.
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/ready')"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  myvita_pg_data:
