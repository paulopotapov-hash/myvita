# Production compose file — deliberately separate from docker-compose.yml
# (the dev file), which mounts source as volumes and exposes Postgres on
# the host for local debugging. Neither of those belong in production.
#
# Usage:
#   docker compose -f docker-compose.prod.yml up -d
#
# Every secret below is required with NO default — compose refuses to start
# rather than silently falling back to a dev credential. Set them via your
# platform's secret manager / CI secrets, or a non-committed .env.production
# file passed with `--env-file`. Never commit real values for these.
#
# This file is intentionally cloud-agnostic — it runs the same way on a
# bare VPS, an AWS/Azure/GCP VM, or any other Docker host. It does not
# include certificate material. See README.md#production for the documented
# HTTP validation overlay and future TLS overlay.
services:
  db:
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER — no insecure default in production}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD — no insecure default in production}
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB — no insecure default in production}
    volumes:
      - myvita_pg_data:/var/lib/postgresql/data
    # No `ports:` mapping here on purpose: Postgres is reachable only from
    # other containers on this compose network, never from the host/public
    # internet. The dev compose file exposes 5432 for local debugging;
    # production must not.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - data

  backup:
    build:
      context: .
      dockerfile: backup/Dockerfile
    restart: always
    environment:
      DB_HOST: db
      DB_PORT: "5432"
      DB_NAME: ${POSTGRES_DB:?Set POSTGRES_DB — no insecure default in production}
      DB_USER: ${POSTGRES_USER:?Set POSTGRES_USER — no insecure default in production}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD — no insecure default in production}
      BACKUP_SCHEDULE: ${BACKUP_SCHEDULE:-0 3 * * *}
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-14}
      BACKUP_RUN_ON_START: ${BACKUP_RUN_ON_START:-true}
      TZ: ${BACKUP_TIMEZONE:-UTC}
      OFFSITE_BACKUP_ENABLED: ${OFFSITE_BACKUP_ENABLED:-false}
      OFFSITE_S3_BUCKET: ${OFFSITE_S3_BUCKET:-}
      OFFSITE_S3_PREFIX: ${OFFSITE_S3_PREFIX:-myvita}
      OFFSITE_S3_ENDPOINT: ${OFFSITE_S3_ENDPOINT:-}
      OFFSITE_S3_REGION: ${OFFSITE_S3_REGION:-us-east-1}
      OFFSITE_S3_SSE: ${OFFSITE_S3_SSE:-AES256}
      OFFSITE_RETENTION_DAYS: ${OFFSITE_RETENTION_DAYS:-30}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - myvita_backups:/backups
      - myvita_backup_metrics:/metrics
    networks:
      - data

  backend:
    build: ./backend
    restart: always
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--proxy-headers", "--forwarded-allow-ips", "172.30.0.10"]
    environment:
      ENVIRONMENT: production
      DEBUG: "false"
      COOKIE_SECURE: "true"
      ALLOW_PUBLIC_CLINIC_ONBOARDING: ${ALLOW_PUBLIC_CLINIC_ONBOARDING:-false}
      ALLOW_PUBLIC_PATIENT_REGISTRATION: ${ALLOW_PUBLIC_PATIENT_REGISTRATION:-false}
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:?Set JWT_SECRET_KEY — generate one, never reuse the dev value}
      CORS_ORIGINS: ${CORS_ORIGINS:-["https://${PUBLIC_DOMAIN:?Set PUBLIC_DOMAIN to the public hostname}"]}
      TRUSTED_PROXIES: '["172.30.0.10"]'
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    # No source volumes: the image built by backend/Dockerfile already
    # contains the code. Mounting source over it here would silently make
    # "production" run whatever happens to be on the host filesystem.
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/ready')"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - edge
      - data

  migrate:
    build: ./backend
    restart: "no"
    command: ["alembic", "upgrade", "head"]
    environment:
      ENVIRONMENT: production
      DEBUG: "false"
      COOKIE_SECURE: "true"
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:?Set JWT_SECRET_KEY — generate one, never reuse the dev value}
      CORS_ORIGINS: ${CORS_ORIGINS:-["https://${PUBLIC_DOMAIN:?Set PUBLIC_DOMAIN to the public hostname}"]}
    depends_on:
      db:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    networks:
      - data

  frontend:
    build:
      context: ./frontend
      args:
        # Browser and API share the proxy origin; relative /api paths keep
        # cookies and CSRF same-origin and avoid unnecessary browser CORS.
        VITE_API_BASE_URL: ""
    restart: always
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/healthz"]
      interval: 15s
      timeout: 3s
      retries: 3
      start_period: 5s
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    # Static production image only: no source mounts, Node process, Vite
    # dev server, or API reverse proxy.
    networks:
      - edge

  proxy:
    build: ./proxy
    restart: always
    environment:
      PUBLIC_DOMAIN: ${PUBLIC_DOMAIN:?Set PUBLIC_DOMAIN to the public hostname}
      NGINX_ENVSUBST_FILTER: ^PUBLIC_DOMAIN$
    depends_on:
      frontend:
        condition: service_healthy
      backend:
        condition: service_healthy
    ports:
      - "${HTTP_PORT:-80}:8080"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/healthz"]
      interval: 15s
      timeout: 3s
      retries: 3
      start_period: 5s
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    networks:
      edge:
        ipv4_address: 172.30.0.10

volumes:
  myvita_pg_data:
  myvita_backups:
  myvita_backup_metrics:

networks:
  edge:
    ipam:
      config:
        - subnet: 172.30.0.0/24
  data:
    internal: true
