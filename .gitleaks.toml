[extend]
useDefault = true

[[allowlists]]
description = "False positive: random 32-byte MFA key generated per test run; historical value was test-only"
commits = ["7fb36c9bc55090ff7c19a13763edf4475fc8f162"]
paths = ['''backend/tests/test_auth_hardening\.py''']
regexTarget = "match"
regexes = ['''TEST_MFA_KEY = "dGVzdC1vbmx5LW1mYS1rZXktMzItYnl0ZXMtbG9uZyE="''']

[[allowlists]]
description = "Documented Portuguese placeholder used in README production examples"
regexTarget = "match"
regexes = ['''gera-um-valor-com-pelo-menos-32-bytes''']

[[allowlists]]
description = "Known prose-only finding in the production-readiness matrix; contains no assigned value"
regexTarget = "secret"
regexes = ['''encryption/immutability''']

[[allowlists]]
description = "P4.1 prose-only privacy review phrase; contains no assigned value"
regexTarget = "secret"
regexes = ['''DPIA/privacy/legal''']

# Integration 2026-10 (Phase 6.2): three test-only fixtures from feature/messages-backend.
# Each entry is pinned to one file and the exact synthetic value.
[[allowlists]]
description = "Test marker string (clinical-content canary), not a credential"
paths = ['''backend/tests/test_appointment_requests_p2_3\.py''']
regexTarget = "match"
regexes = ['''SECRET_REASON = "P23-CLINICAL-REASON-MARKER"''']

[[allowlists]]
description = "Synthetic JWT key (keyboard sequence) used only to build a production Settings object in a validation test"
paths = ['''backend/tests/test_audit_siem_export\.py''']
regexTarget = "match"
regexes = ['''JWT_SECRET_KEY="qwertyuiopasdfghjklzxcvbnm1234567890QWERTY"''']

[[allowlists]]
description = "Synthetic document storage keys (hex file names) in the backup script test, not credentials"
paths = ['''scripts/test_documents_backup_scripts\.sh''']
regexTarget = "match"
regexes = ['''key1=0123456789abcdef0123456789abcdef''', '''key2=fedcba9876543210fedcba9876543210''']
